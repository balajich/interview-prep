version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sql_interview_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: interviewdb
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    volumes:
      - ./init:/docker-entrypoint-initdb.d   # runs all *.sql files on first start
      - pgdata:/var/lib/postgresql/data      # data persists across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interviewdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sql_interview_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@interview.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

# ── Quick start ──────────────────────────────────────────────────────────────
# docker-compose up -d
#
# Connect via psql:
#   docker exec -it sql_interview_db psql -U interview -d interviewdb
#
# Connect via pgAdmin (browser):
#   http://localhost:5050
#   Host: postgres  Port: 5432  DB: interviewdb  User: interview  Pass: interview
